<script>
'use strict';
(() => {
  // Plansza 2 (kable/kable/plansza2_strona.py): kafelki dół (podkład pod kablami + kable) i góra (nad kablami + listy) na dwóch

  // potrzebne); kafelek, którego jeszcze nie ma, zastępuje wycinek grubszego poziomu; w pamięci najwyżej LIMIT bitmap.
  const D = window.P2, T = window.KAF, $ = id => document.getElementById(id);
  const scena = $('scena');
  const C = { dol: $('c_dol').getContext('2d', { alpha: false }), kabel: $('c_kabel').getContext('2d'),

  let s = 1, tx = 0, ty = 0, W = 0, H = 0, dpr = 1, sMin = 0.1, sMax = 60;
  const PAS = { j: 'rgba(230,30,30,.32)', c: 'rgba(255,70,60,.38)' }, KABEL = { j: '#dc1414', c: '#ff4a3d' },
        BRZEG = { j: '#7a0000', c: '#ffb0a8' }, WIERSZ = { j: 'rgba(230,30,30,.20)', c: 'rgba(255,70,60,.34)' };

  // ---------- tryb ciemny: wg systemu, przełącznik zapamiętany ----------
  let ciemny = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
  try { const z = localStorage.getItem('plansza2_ciemny'); if (z !== null) ciemny = z === '1'; } catch (e) {}
  const tryb = () => (ciemny ? 'c' : 'j');
  document.documentElement.classList.toggle('ciemny', ciemny);

  // ---------- paczki kafelków ----------
  window.KAF_DANE = window.KAF_DANE || {};
  const paczkaPoziomu = {}, wczytane = {};
  T.paczki.forEach((p, i) => p.poziomy.forEach(L => { paczkaPoziomu[L] = i; }));
  function paczka(i) {                                     // skrypt paczki – raz; po wczytaniu przerysowanie
    if (wczytane[i]) return;
    wczytane[i] = 'w toku';
    const el = document.createElement('script');
    el.src = T.paczki[i].plik;
    el.onload = () => { wczytane[i] = true; rysuj(); };
    el.onerror = () => { wczytane[i] = false; };
    document.head.appendChild(el);
  }

  // ---------- kafelki ----------
  const kaf = new Map();
  for (const [w, L, c, r, x, y, ww, hh] of T.kafelki) kaf.set(`${w}|${L}|${c}|${r}`, { w, L, c, r, x, y, ww, hh, bm: null, lad: false, ramka: 0 });
  const POZ = T.poziomy, MM = L => T.px / L;
  const LIMIT = navigator.maxTouchPoints > 0 || matchMedia('(pointer: coarse)').matches ? 12 : 20;   // bitmapy w pamięci (kafelek 2048 px ≈ 17 MB; iPhone ma mało)
  let ramka = 0, kolejka = [], wToku = 0;
  const zaladowane = new Set();
  function pompuj() {
    while (wToku < 6 && kolejka.length) {
      kolejka.sort((a, b) => b.prio - a.prio);
      const k = kolejka.shift();
      if (k.bm || (k.L !== POZ[0] && ramka - k.ramka > 2)) { k.lad = false; continue; }   // już niepotrzebny
      const b64 = window.KAF_DANE[`${k.w}_${k.L}_${k.c}_${k.r}`];
      if (!b64) { k.lad = false; paczka(paczkaPoziomu[k.L]); continue; }
      wToku++;
      const im = new Image();
      im.src = 'data:image/webp;base64,' + b64;
      im.decode().then(() => createImageBitmap(im)).then(bm => {
        k.bm = bm; zaladowane.add(k); przytnij(); rysuj();
      }).catch(() => {}).finally(() => { k.lad = false; wToku--; pompuj(); });
    }
  }
  function zamow(k, prio) { k.prio = prio; if (!k.lad && !k.bm) { k.lad = true; kolejka.push(k); } }

  }
  function przodek(k) {                                    // najbliższy wczytany kafelek grubszego poziomu

      if (p && p.bm) return p;
    }
    return null;
  }

    const m = MM(L);
    const c0 = Math.max(0, Math.floor(x0 / m)), c1 = Math.floor(x1 / m), r0 = Math.max(0, Math.floor(y0 / m)), r1 = Math.floor(y1 / m);

      const k = kaf.get(`${w}|${L}|${c}|${r}`);
      if (!k) continue;                                    // pusty kafelek
      k.ramka = ramka;
      if (k.bm) { ctx.drawImage(k.bm, k.x - e, k.y - e, k.ww + 2 * e, k.hh + 2 * e); continue; }

      const p = przodek(k);
      if (p) {

        const f = p.L;
        ctx.drawImage(p.bm, (k.x - p.x) * f, (k.y - p.y) * f, k.ww * f, k.hh * f, k.x - e, k.y - e, k.ww + 2 * e, k.hh + 2 * e);
      }
    }
  }
  let plan = 0;
  function rysuj() { if (!plan) plan = requestAnimationFrame(rysujTeraz); }
  const sciezki = {};
  function rysujTeraz() {
    plan = 0; ramka++;
    const pw = Math.round(W * dpr), ph = Math.round(H * dpr);
    for (const [n, ctx] of Object.entries(C)) {
      const cv = ctx.canvas;
      if (cv.width !== pw || cv.height !== ph) { cv.width = pw; cv.height = ph; }
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      if (n === 'dol') { ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, pw, ph); } else ctx.clearRect(0, 0, pw, ph);
      ctx.setTransform(dpr * s, 0, 0, dpr * s, dpr * tx, dpr * ty);
      ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'medium';
    }
    let L = POZ.find(p => p >= s * dpr * 0.85); if (L === undefined) L = POZ[POZ.length - 1];
    const x0 = -tx / s, y0 = -ty / s, x1 = (W - tx) / s, y1 = (H - ty) / s, cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
    warstwa(C.dol, 'dol', L, x0, y0, x1, y1, cx, cy);
    const sw = swieci && D.swiatlo[swieci];
    if (sw) {                                              // pas wzdłuż osi i kabel na czerwono – pod otworami i wymiarami
      const p = sciezki[swieci] ||= [new Path2D(sw[0]), new Path2D(sw[1])], k = C.kabel;
      k.lineCap = 'round'; k.lineJoin = 'round';
      k.strokeStyle = PAS[tryb()]; k.lineWidth = Math.max(2.2, 8 / s); k.stroke(p[1]);
      k.fillStyle = KABEL[tryb()]; k.fill(p[0]);
      k.strokeStyle = BRZEG[tryb()]; k.lineWidth = 0.04; k.stroke(p[0]);
    }
    warstwa(C.gora, 'gora', L, x0, y0, x1, y1, cx, cy);
    if (swieci && wiersze[swieci]) {
      C.wiersze.fillStyle = WIERSZ[tryb()];
      for (const r of wiersze[swieci]) C.wiersze.fillRect(r[0], r[1], r[2], r[3]);
    }
    pompuj();
  }

  // ---------- widok ----------
  function rozmiar() { W = scena.clientWidth; H = scena.clientHeight; dpr = window.devicePixelRatio || 1; }
  const dopasowanie = () => Math.min(W / D.W, H / D.H) * 0.97;
  function calosc() {
    rozmiar();
    s = dopasowanie(); sMin = s * 0.6;
    tx = (W - D.W * s) / 2; ty = (H - D.H * s) / 2;
    rysuj();
  }
  function zoom(f, px, py) {
    const ns = Math.min(Math.max(s * f, sMin), sMax);
    f = ns / s; tx = px - (px - tx) * f; ty = py - (py - ty) * f; s = ns;
    rysuj();
  }

  // ---------- podświetlenie i karta ----------
  const wiersze = {};
  for (const [w, x, y, ww, hh] of D.wiersze) (wiersze[w] ||= []).push([x, y, ww, hh]);
  const trafKabel = zbudujTrafienia(D.swiatlo, 4);
  let wybrany = null, podKursorem = null, swieci = null;
  const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  function ustaw() {
    const w = wybrany || podKursorem;
    if (w !== swieci) { swieci = w; rysuj(); }
    const k = $('karta'), c = wybrany && D.karty[wybrany];
    if (!c) { k.hidden = true; return; }
    k.innerHTML = `<div><span class="n">${esc(c.n)}</span><span class="s">${esc(c.s)}</span></div>` +
      (c.o ? `<div class="o">${esc(c.o)}</div>` : '') +
      (c.t && !c.s.startsWith(c.t) ? `<div class="t">${esc(c.t)}</div>` : '') +
      `<div class="l">${c.l.map(esc).join(' → ')}</div>`;
    k.hidden = false;
  }
  function kabelPod(px, py) {
    const x = (px - tx) / s, y = (py - ty) / s;
    const w = trafKabel(x, y, 8 / s);
    if (w) return w;
    for (const [ww, rx, ry, rw, rh] of D.wiersze) if (x >= rx && x <= rx + rw && y >= ry && y <= ry + rh) return ww;
    return null;
  }

  // ---------- mysz i dotyk ----------
  const palce = new Map();
  let ruch = null, szczypanie = null, przedKlikiem = null;
  const odl = (a, b) => Math.hypot(a.x - b.x, a.y - b.y), srodek = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
  function noweSzczypanie() {                              // od bieżącej pary palców (też gdy jeden z nich się zmieni)
    const [a, b] = [...palce.values()];
    szczypanie = { d: Math.max(odl(a, b), 1), m: srodek(a, b), s, tx, ty };
  }
  scena.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button === 2) return;           // prawy przycisk – nic
    palce.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (palce.size === 1) ruch = { x: e.clientX, y: e.clientY, tx, ty, ruszony: false, px: e.clientX, py: e.clientY,
                                   tylkoRuch: e.pointerType === 'mouse' && e.button === 1 };   // środkowy – tylko przesuwanie
    else { noweSzczypanie(); if (ruch) ruch.ruszony = true; }
    scena.setPointerCapture(e.pointerId);
  });
  scena.addEventListener('pointermove', e => {
    if (!palce.has(e.pointerId)) {                         // najechanie myszą
      if (e.pointerType !== 'mouse') return;
      const w = kabelPod(e.clientX, e.clientY);
      scena.style.cursor = w ? 'pointer' : '';
      if (w !== podKursorem) { podKursorem = w; ustaw(); }
      return;
    }
    if (e.pointerType === 'mouse' && e.buttons === 0) { koniec(e); return; }   // zgubione puszczenie przycisku
    palce.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (palce.size >= 2 && szczypanie) {
      const [a, b] = [...palce.values()], m = srodek(a, b);
      const ns = Math.min(Math.max(szczypanie.s * odl(a, b) / szczypanie.d, sMin), sMax), f = ns / szczypanie.s;
      tx = m.x - (szczypanie.m.x - szczypanie.tx) * f; ty = m.y - (szczypanie.m.y - szczypanie.ty) * f; s = ns;
      rysuj();
    } else if (ruch) {
      const dx = e.clientX - ruch.x, dy = e.clientY - ruch.y;
      if (!ruch.ruszony && Math.hypot(dx, dy) > 6) { ruch.ruszony = true; scena.classList.add('ciagnie'); }
      if (ruch.ruszony) { tx = ruch.tx + dx; ty = ruch.ty + dy; rysuj(); }
    }
  });
  function koniec(e) {
    if (!palce.has(e.pointerId)) return;
    palce.delete(e.pointerId);
    if (palce.size >= 2) noweSzczypanie();
    else szczypanie = null;
    if (palce.size === 1) {                                // po szczypaniu dalej jednym palcem – bez skoku
      const p = [...palce.values()][0];
      ruch = { x: p.x, y: p.y, tx, ty, ruszony: true };
    } else if (palce.size === 0 && ruch) {
      if (!ruch.ruszony && !ruch.tylkoRuch && e.type === 'pointerup') {   // kliknięcie / dotknięcie: przypnij albo odepnij
        const w = kabelPod(ruch.px, ruch.py);
        przedKlikiem = { w: wybrany, t: performance.now() };
        wybrany = w && w !== wybrany ? w : null;
        if (e.pointerType !== 'mouse') podKursorem = null;
        ustaw();
      }
      ruch = null;
      scena.classList.remove('ciagnie');
    }
  }
  scena.addEventListener('pointerup', koniec);
  scena.addEventListener('pointercancel', koniec);
  scena.addEventListener('contextmenu', e => e.preventDefault());
  scena.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse' && !palce.size && podKursorem) { podKursorem = null; ustaw(); } });
  scena.addEventListener('wheel', e => {                   // touchpad (ctrl): deltaY = -100·ln(skala) – przybliżenie 1:1 z palcami
    e.preventDefault();
    zoom(Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0015)), e.clientX, e.clientY);
  }, { passive: false });
  scena.addEventListener('dblclick', e => {                // podwójne kliknięcie – przybliżenie; przypięcie jak przed nim
    if (przedKlikiem && performance.now() - przedKlikiem.t < 600) { wybrany = przedKlikiem.w; ustaw(); }
    zoom(2, e.clientX, e.clientY);
  });
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('keydown', e => {
    if (e.key === 'f' || e.key === 'F' || e.key === 'Home') calosc();
    if (e.key === 'Escape') { wybrany = null; ustaw(); }
  });
  $('b-cal').addEventListener('click', calosc);
  $('b-ciem').addEventListener('click', () => {           // ciemny = filtr na canvasach – bez wczytywania kafelków
    ciemny = !ciemny;
    document.documentElement.classList.toggle('ciemny', ciemny);
    try { localStorage.setItem('plansza2_ciemny', ciemny ? '1' : '0'); } catch (e) {}
    rysuj();
  });
  window.addEventListener('resize', () => {
    const cx = (W / 2 - tx) / s, cy = (H / 2 - ty) / s;
    rozmiar(); sMin = Math.min(sMin, dopasowanie() * 0.6);
    tx = W / 2 - cx * s; ty = H / 2 - cy * s; rysuj();
  });
  function wstepne() { paczka(0); for (const k of kaf.values()) if (k.L === POZ[0]) zamow(k, 1e9); pompuj(); }
  rozmiar(); wstepne(); calosc();
  const h = Object.fromEntries(location.hash.slice(1).split('&').map(p => p.split('=')).filter(p => p.length === 2));
  const hx = +h.x, hy = +h.y, hs = +h.s;                   // #x=…&y=…&s=… – widok od razu na fragmencie (mm, px/mm)
  if ([hx, hy, hs].every(Number.isFinite) && hs > 0) {
    s = Math.min(Math.max(hs, sMin), sMax); tx = W / 2 - hx * s; ty = H / 2 - hy * s; rysuj();
  }

  // trafienie w kabel: osie kabli w siatce komórek, najbliższy odcinek w promieniu
  function zbudujTrafienia(swiatlo, KOM) {
    const odc = [], wpisy = [], siatka = new Map();
    for (const [w, sw] of Object.entries(swiatlo)) {
      const wi = wpisy.push(w) - 1;
      for (const sub of sw[1].split('M')) {
        if (!sub) continue;
        const p = sub.split('L').map(t => t.trim().split(/\s+/).map(Number));
        for (let i = 1; i < p.length; i++) {
          const a = p[i - 1], b = p[i], k = odc.length / 5;
          odc.push(a[0], a[1], b[0], b[1], wi);
          for (let c = Math.floor(Math.min(a[0], b[0]) / KOM); c <= Math.floor(Math.max(a[0], b[0]) / KOM); c++)
            for (let r = Math.floor(Math.min(a[1], b[1]) / KOM); r <= Math.floor(Math.max(a[1], b[1]) / KOM); r++) {
              const kl = c * 4096 + r;
              let l = siatka.get(kl); if (!l) siatka.set(kl, l = []); l.push(k);
            }
        }
      }
    }
    const O = Float32Array.from(odc);
    return function (x, y, tol) {
      let best = tol * tol, bw = null;
      for (let c = Math.floor((x - tol) / KOM); c <= Math.floor((x + tol) / KOM); c++)
        for (let r = Math.floor((y - tol) / KOM); r <= Math.floor((y + tol) / KOM); r++) {
          const l = siatka.get(c * 4096 + r); if (!l) continue;
          for (const k of l) {
            const i = k * 5, ax = O[i], ay = O[i + 1], dx = O[i + 2] - ax, dy = O[i + 3] - ay, L = dx * dx + dy * dy;
            let t = L ? ((x - ax) * dx + (y - ay) * dy) / L : 0; t = t < 0 ? 0 : t > 1 ? 1 : t;
            const ex = ax + t * dx - x, ey = ay + t * dy - y, d = ex * ex + ey * ey;
            if (d < best) { best = d; bw = wpisy[O[i + 4]]; }
          }
        }
      return bw;
    };
  }
})();
</script>
